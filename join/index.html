<title>Join Blend as a creator</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Film for brands with Blend">

<!-- A short link for creators: blend-marketing.com/join. It opens the same
     form on the creator side and carries any ?src= code with it, so a
     creator who arrives from the open call is still counted against it. -->
<script>
  var q = location.search.replace(/^\?/, '');
  location.replace('/start/?type=creator' + (q ? '&' + q : ''));
</script>
<noscript><meta http-equiv="refresh" content="0; url=/start/?type=creator"></noscript>
